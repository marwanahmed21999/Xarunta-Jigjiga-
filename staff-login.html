<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mitarbeiter-Login | Xarunta Deegaanka Soomaalida</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1a4fa0;--blue-dark:#0d2d6b;--blue-pale:#e8f0fb;
  --sand:#c9963a;--sand-light:#e8b85a;
  --white:#f7f9fd;--ink:#0d1b3e;--gray:#5a6880;--border:#c8d4e8;
  --shadow:0 12px 48px rgba(13,27,62,.18);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--blue-dark);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px;}
.card{background:#fff;border-radius:18px;max-width:420px;width:100%;box-shadow:var(--shadow);overflow:hidden;}
.top{background:var(--blue-dark);padding:26px 32px;}
.top h1{font-family:'Playfair Display',serif;color:#fff;font-size:1.3rem;margin-bottom:4px;}
.top p{color:rgba(255,255,255,.55);font-size:.82rem;}
.body{padding:26px 32px 32px;}
.fg{margin-bottom:14px;}
.fg label{display:block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gray);margin-bottom:6px;}
.fg input{width:100%;border:1.5px solid var(--border);padding:11px 14px;border-radius:8px;font-size:.9rem;font-family:inherit;outline:none;}
.fg input:focus{border-color:var(--blue);}
.btn{width:100%;background:var(--blue-dark);color:#fff;border:none;padding:14px;border-radius:10px;font-size:.92rem;font-weight:700;cursor:pointer;font-family:inherit;margin-top:6px;}
.btn:hover{background:var(--blue);}
.msg{padding:12px 14px;border-radius:8px;font-size:.83rem;margin-bottom:14px;}
.msg.err{background:#f9ecec;color:#8b1a1a;}
.foot{text-align:center;margin-top:16px;font-size:.82rem;color:var(--gray);}
.foot a{color:var(--blue);}
.lang-sw{display:flex;gap:6px;justify-content:center;margin-bottom:14px;}
.lb{background:none;border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.7);padding:3px 10px;border-radius:4px;cursor:pointer;font-size:.72rem;font-family:inherit;font-weight:600;}
.lb.on,.lb:hover{background:var(--sand);border-color:var(--sand);color:var(--blue-dark);}

.so{display:block!important;}.en{display:none!important;}.am{display:none!important;}.de{display:none!important;}
span.so{display:inline!important;}span.en{display:none!important;}span.am{display:none!important;}span.de{display:none!important;}
body.lang-en .so{display:none!important;}body.lang-en .en{display:block!important;}
body.lang-en span.so{display:none!important;}body.lang-en span.en{display:inline!important;}
body.lang-am .so{display:none!important;}body.lang-am .am{display:block!important;}
body.lang-am span.so{display:none!important;}body.lang-am span.am{display:inline!important;}
body.lang-de .so{display:none!important;}body.lang-de .de{display:block!important;}
body.lang-de span.so{display:none!important;}body.lang-de span.de{display:inline!important;}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="lang-sw">
      <button class="lb on" id="btn-so">SO</button>
      <button class="lb" id="btn-en">EN</button>
      <button class="lb" id="btn-am">አማ</button>
      <button class="lb" id="btn-de">DE</button>
    </div>
    <h1><span class="so">Gal Shaqaalaha</span><span class="en">Staff Login</span><span class="am">የሰራተኛ መግቢያ</span><span class="de">Mitarbeiter-Login</span></h1>
    <p>Kebele · <span class="so">Dugsiga</span><span class="en">School</span><span class="am">ት/ቤት</span><span class="de">Schule</span> · <span class="so">Caafimaadka</span><span class="en">Health Center</span><span class="am">ጤና ማዕከል</span><span class="de">Gesundheitszentrum</span> · GovPay</p>
  </div>
  <div class="body">
    <div id="msg"></div>
    <div class="fg"><label>Staff-ID</label><input type="text" id="staffId" placeholder="z.B. KB-STAFF-001"></div>
    <div class="fg"><label><span class="so">Furaha Sirta ah</span><span class="en">Password</span><span class="am">የይለፍ ቃል</span><span class="de">Passwort</span></label><input type="password" id="pw" placeholder="••••••••"></div>
    <button class="btn" id="btnLogin"><span class="so">Gal</span><span class="en">Login</span><span class="am">ግባ</span><span class="de">Einloggen</span></button>
    <div class="foot"><span class="so">Weli akoon ma lihid?</span><span class="en">No account yet?</span><span class="am">ገና መለያ የለዎትም?</span><span class="de">Noch kein Konto?</span> <a href="register.html"><span class="so">Diiwaangeli</span><span class="en">Register</span><span class="am">ይመዝገቡ</span><span class="de">Registrieren</span></a></div>
  </div>
</div>

<script type="module">
import { login } from './src/auth.js';
import { initLangSwitcher, t } from './src/i18n.js';

['so','en','am','de'].forEach(l => {
  document.getElementById('btn-' + l).addEventListener('click', (e) => window.setLang(l, e.target));
});
initLangSwitcher();

document.getElementById('btnLogin').addEventListener('click', async () => {
  const msg = document.getElementById('msg');
  msg.innerHTML = '';
  const staffId = document.getElementById('staffId').value.trim();
  const pw = document.getElementById('pw').value;
  if (!staffId || !pw) {
    msg.innerHTML = '<div class="msg err">' + t({so:'Fadlan Staff-ID iyo furaha sirta ah geli.', en:'Please enter Staff ID and password.', am:'እባክዎ የሰራተኛ መታወቂያ እና የይለፍ ቃል ያስገቡ።', de:'Bitte Staff-ID und Passwort eingeben.'}) + '</div>';
    return;
  }

  const result = await login(staffId, pw, null, { skipOrganCheck: true });
  if (!result.success) {
    msg.innerHTML = '<div class="msg err">❌ ' + result.error + '</div>';
    return;
  }
  window.location.href = 'staff-dashboard.html';
});
</script>
</body>
</html>
